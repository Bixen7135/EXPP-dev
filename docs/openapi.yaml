openapi: "3.1.0"
info:
  title: EXPP API
  version: "1.0.0"
  description: >
    EXPP — Educational Workflow Platform v1.
    All endpoints require authentication via the `expp_session` HTTP-only cookie
    unless noted as public.
  contact:
    name: EXPP Project

servers:
  - url: /api
    description: Next.js App Router API

tags:
  - name: auth
    description: Authentication and session management
  - name: materials
    description: Teacher material upload and management
  - name: generation
    description: AI-driven assignment generation
  - name: assignments
    description: Assignment editing and versioning
  - name: distribution
    description: Assignment distribution to students
  - name: attempts
    description: Student attempt lifecycle (draft and submission)
  - name: ai-help
    description: Student AI help requests (policy-gated)
  - name: assessment
    description: Teacher grading and result publication
  - name: analytics
    description: Analytics dashboards
  - name: admin
    description: Admin user management and audit log

# ── Shared components ──────────────────────────────────────────────────────
components:
  schemas:
    ApiSuccess:
      type: object
      required: [success, data, traceId]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          description: Response payload (schema varies per endpoint)
        traceId:
          type: string

    ApiError:
      type: object
      required: [success, error, code, traceId]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
        code:
          type: string
          enum: [AUTH_ERROR, FORBIDDEN, NOT_FOUND, VALIDATION_ERROR, RATE_LIMITED]
        traceId:
          type: string

    Role:
      type: string
      enum: [STUDENT, TEACHER, ADMIN]

    AiHelpMode:
      type: string
      enum: [NO_HELP, CLARIFICATION, GUIDED, POST_ASSESSMENT]

    AssignmentStatus:
      type: string
      enum: [DRAFT, PUBLISHABLE, ASSIGNED]

    AssessmentStatus:
      type: string
      enum: [PENDING, AUTO_CHECKED, REVIEWED, PUBLISHED]

    AutoCheckStatus:
      type: string
      enum: [NOT_STARTED, QUEUED, PROCESSING, READY, FAILED]

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: expp_session

security:
  - sessionCookie: []

# ── Paths ──────────────────────────────────────────────────────────────────
paths:

  # ── Auth ─────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, role]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                role:
                  type: string
                  enum: [STUDENT, TEACHER]
      responses:
        "200":
          description: Registered. Session cookie set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /auth/login:
    post:
      tags: [auth]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Authenticated. Session cookie set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Rate limited (10 req/min per IP)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout. Clears session cookie and deletes session from DB.
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

  /auth/me:
    get:
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  # ── Materials ─────────────────────────────────────────────────────────────

  /materials:
    get:
      tags: [materials]
      summary: List teacher's materials
      description: TEACHER role required. Returns only materials owned by the authenticated teacher.
      responses:
        "200":
          description: Material list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "403":
          description: Not a teacher
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

    post:
      tags: [materials]
      summary: Upload a material (PDF, Word, Excel, PowerPoint, TXT, MD, CSV)
      description: TEACHER role required. Max 50 MB for binary formats and 10 MB for text formats.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
      responses:
        "201":
          description: Material uploaded and text extracted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "422":
          description: Unsupported file type or size exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /materials/{id}:
    get:
      tags: [materials]
      summary: Get material detail including extracted text
      description: TEACHER role required. Returns ForbiddenError if not the owner.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Material detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "403":
          description: Not the owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

    delete:
      tags: [materials]
      summary: Delete a material
      description: TEACHER role required. Owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "403":
          description: Not the owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  # ── Generation ────────────────────────────────────────────────────────────

  /generation:
    get:
      tags: [generation]
      summary: List generation requests for the authenticated teacher
      responses:
        "200":
          description: Generation request list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

    post:
      tags: [generation]
      summary: Create a new generation request
      description: TEACHER role required. Triggers background generation pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [constraints, materialIds]
              properties:
                constraints:
                  type: object
                  description: GenerationConstraints (topic, difficulty, format, questionCount, etc.)
                materialIds:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Generation request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "422":
          description: Invalid constraints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /generation/{id}:
    get:
      tags: [generation]
      summary: Get generation request detail (plan + result)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Generation detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "403":
          description: Not the owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /generation/{id}/regenerate:
    post:
      tags: [generation]
      summary: Regenerate an assignment from the same request
      description: Preserves requestId for traceability.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                constraints:
                  type: object
                  description: Optional updated constraints
      responses:
        "200":
          description: Regeneration started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

  # ── Assignments ───────────────────────────────────────────────────────────

  /assignments:
    get:
      tags: [assignments]
      summary: List teacher's assignments
      responses:
        "200":
          description: Assignment list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

    post:
      tags: [assignments]
      summary: Create assignment from a generation result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generationResultId]
              properties:
                generationResultId: { type: string }
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

  /assignments/{id}:
    get:
      tags: [assignments]
      summary: Get assignment detail with current version content
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Assignment detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

    patch:
      tags: [assignments]
      summary: Update assignment content (creates a new version)
      description: Editing a PUBLISHABLE assignment reverts it to DRAFT.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                instructions: { type: string }
                items:
                  type: array
                  description: Full replacement item list
      responses:
        "200":
          description: Updated (new version created)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "422":
          description: ASSIGNED assignments cannot be edited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

    delete:
      tags: [assignments]
      summary: Delete an assignment
      description: TEACHER role required. ASSIGNED assignments cannot be deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "422":
          description: Assignment is ASSIGNED and cannot be deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /assignments/{id}/publish:
    post:
      tags: [assignments]
      summary: Transition assignment to PUBLISHABLE status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Now PUBLISHABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "422":
          description: Already PUBLISHABLE or ASSIGNED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /assignments/{id}/versions:
    get:
      tags: [assignments]
      summary: List version history for an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

  /assignments/{id}/versions/{vId}/restore:
    post:
      tags: [assignments]
      summary: Restore a previous version (creates a new version)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: vId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Restored (new version created)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

  # ── Distribution ──────────────────────────────────────────────────────────

  /distribution:
    get:
      tags: [distribution]
      summary: List teacher's distributions
      responses:
        "200":
          description: Distribution list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

    post:
      tags: [distribution]
      summary: Create a distribution (assign to students)
      description: |
        TEACHER role required. Assignment must be PUBLISHABLE.
        AI mode restrictions apply for mandatory graded assignments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignmentId, versionId, distributionStatus, isGraded, aiHelpMode, recipientStudentIds]
              properties:
                assignmentId: { type: string }
                versionId: { type: string }
                deadline: { type: string, format: date-time, nullable: true }
                distributionStatus: { type: string, enum: [MANDATORY, PRACTICE] }
                isGraded: { type: boolean }
                aiHelpMode: { $ref: "#/components/schemas/AiHelpMode" }
                recipientStudentIds:
                  type: array
                  items: { type: string }
                  minItems: 1
      responses:
        "201":
          description: Distribution created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "422":
          description: Invalid AI mode for assignment type or empty recipients
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /distribution/{id}:
    get:
      tags: [distribution]
      summary: Get distribution detail with recipient list
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Distribution detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

  # ── Attempts ──────────────────────────────────────────────────────────────

  /attempts:
    get:
      tags: [attempts]
      summary: List student's attempts
      description: STUDENT role required.
      responses:
        "200":
          description: Attempt list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

    post:
      tags: [attempts]
      summary: Get or create attempt for a recipient record
      description: STUDENT role required. Idempotent — returns existing attempt if it exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId]
              properties:
                recipientId: { type: string }
      responses:
        "200":
          description: Attempt (existing or newly created)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

  /attempts/{id}:
    get:
      tags: [attempts]
      summary: Get attempt detail (expected answers stripped)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Attempt detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

    patch:
      tags: [attempts]
      summary: Save draft answers
      description: STUDENT role required. Rejected if attempt is already SUBMITTED.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      itemOrder: { type: integer }
                      text: { type: string }
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "422":
          description: Already submitted (immutable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /attempts/{id}/submit:
    post:
      tags: [attempts]
      summary: Submit attempt (irreversible)
      description: STUDENT role required. Attempt becomes immutable and queues automatic AI assessment analysis.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "422":
          description: Already submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  # ── AI Help ───────────────────────────────────────────────────────────────

  /ai-help:
    post:
      tags: [ai-help]
      summary: Send AI help request (policy-gated)
      description: |
        STUDENT role required. Three-layer policy enforcement:
        1. UI layer (client-side mode check)
        2. Server layer (policy-engine.ts)
        3. Gateway layer (ai-help-gateway.ts)

        Blocked requests return 403 and are logged in the audit trail.
        All requests (allowed and blocked) are logged as HelpRequest records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attemptId, message]
              properties:
                attemptId: { type: string }
                message: { type: string }
      responses:
        "200":
          description: AI response returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "403":
          description: Help blocked by policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  # ── Assessment ────────────────────────────────────────────────────────────

  /assessment:
    get:
      tags: [assessment]
      summary: List submitted attempts for a distribution
      description: TEACHER role required. Query param distributionId required.
      parameters:
        - name: distributionId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Submission list with assessment status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

  /assessment/{attemptId}:
    get:
      tags: [assessment]
      summary: Get assessment detail for an attempt
      description: TEACHER role required. Returns assessment status, autoCheckStatus, latestAiRun, and aiRecommendation when available.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Assessment with auto-check results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

    post:
      tags: [assessment]
      summary: Get or create assessment for an attempt
      description: TEACHER role required. Ensures baseline deterministic auto-check exists.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Assessment baseline ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

  /assessment/{attemptId}/analyze:
    post:
      tags: [assessment]
      summary: Manually enqueue AI analysis / re-analysis
      description: TEACHER role required. Queues AI semantic assessment and sets autoCheckStatus to QUEUED.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Assessment queued for AI analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

  /assessment/{attemptId}/review:
    patch:
      tags: [assessment]
      summary: Save teacher review (grade + comment)
      description: TEACHER role required. Transitions to REVIEWED. Blocked if already PUBLISHED.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manualGrade, maxGrade]
              properties:
                manualGrade: { type: number, minimum: 0 }
                maxGrade: { type: number, minimum: 0 }
                comment: { type: string, nullable: true }
                itemOverrides:
                  type: array
                  items:
                    type: object
                    properties:
                      itemOrder: { type: integer, minimum: 1 }
                      teacherScore: { type: number, minimum: 0 }
                      reason: { type: string }
      responses:
        "200":
          description: Assessment updated to REVIEWED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "422":
          description: Grade > maxGrade or assessment already PUBLISHED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /assessment/{attemptId}/publish:
    post:
      tags: [assessment]
      summary: Publish assessment result (REVIEWED → PUBLISHED)
      description: TEACHER role required. Allowed only from REVIEWED status. Result becomes visible to student and immutable after publication.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "422":
          description: Not REVIEWED or already PUBLISHED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /assessment/{attemptId}/result:
    get:
      tags: [assessment]
      summary: Get published result (student view)
      description: STUDENT role required. Returns 404 if not yet published.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Published result with grade, percentage, and feedback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "404":
          description: Result not yet published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  # ── Analytics ─────────────────────────────────────────────────────────────

  /analytics/teacher:
    get:
      tags: [analytics]
      summary: Teacher analytics — per-distribution stats
      description: TEACHER role required. Returns engagement metrics for all the teacher's distributions.
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

  /analytics/student:
    get:
      tags: [analytics]
      summary: Student analytics — assignment progress and grades
      description: STUDENT role required.
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

  # ── Admin ─────────────────────────────────────────────────────────────────

  /admin/users:
    get:
      tags: [admin]
      summary: List all users
      description: ADMIN role required.
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }

  /admin/users/{id}:
    patch:
      tags: [admin]
      summary: Update user role or active status
      description: ADMIN role required. Cannot modify your own account. Cannot demote the last admin.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive: { type: boolean }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "422":
          description: Self-modification or last-admin guard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /admin/audit:
    get:
      tags: [admin]
      summary: Audit log with filters
      description: |
        ADMIN: full log with optional userId filter.
        TEACHER: scoped to own events only.
      parameters:
        - name: action
          in: query
          schema: { type: string }
          description: e.g. "auth.login", "attempt.submitted"
        - name: userId
          in: query
          schema: { type: string }
          description: Admin only — filter by user
        - name: entityType
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: Paginated audit log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
